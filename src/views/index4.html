<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/webrtc-adapter/8.1.2/adapter.min.js"
      integrity="sha512-l40eBFtXx+ve5RryIELC3y6/OM6Nu89mLGQd7fg1C93tN6XrkC3supb+/YiD/Y+B8P37kdJjtG1MT1kOO2VzxA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>

  <body>
    <div class="grid">
      <h1>Video Call — User 2</h1>
      <div>
        <h2>Local stream (you)</h2>
        <video id="local" muted autoplay playsinline></video>
      </div>
      <div>
        <h2>Remote stream (User 1)</h2>
        <video id="remote" autoplay playsinline></video>
        <p id="status" class="status"></p>
      </div>
    </div>

    <script type="module">
      const API_BASE = "http://localhost:8092";
      const ROOM_TOKEN = "pmZYT4i4";

      const USER_2_TOKEN = await signIn("test@gmail.com", "123456");

      function getHeader(TOKEN) {
        return {
          Authorization: `Bearer ${TOKEN}`,
          "Content-Type": "application/json",
        };
      }

      const localVideo = document.querySelector("video#local");
      const remoteVideo = document.querySelector("video#remote");
      const statusEl = document.getElementById("status");
      if (!(localVideo instanceof HTMLVideoElement) || !(remoteVideo instanceof HTMLVideoElement))
        throw new Error("video#local and video#remote should be video elements");

      // ========== Part 1: Same flow as index3 — User 2 sends own video/audio ==========
      const media = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      localVideo.srcObject = media;

      const mySessionId = await createCallsSession(USER_2_TOKEN);
      // const sendPeerConnection = await createPeerConnection();
      const pc = await createPeerConnection();

      const transceivers = media.getTracks().map((track) =>
              pc.addTransceiver(track, { direction: "sendonly" })
      );

      const localOffer = await pc.createOffer();
      await pc.setLocalDescription(localOffer);

      const pushTracksResponse = await fetch(
        `${API_BASE}/share-nest/api/v1/talk/sessions/${mySessionId}/tracks/publish`,
        {
          method: "POST",
          headers: getHeader(USER_2_TOKEN),
          body: JSON.stringify({
            sessionDescription: { sdp: localOffer.sdp, type: "offer" },
            tracks: transceivers.map(({ mid, sender }) => ({
              location: "local",
              mid,
              kind: sender.track?.kind,
              trackName: sender.track?.id,
            })),
          }),
        }
      ).then((res) => res.json());
      console.log("User 2 publish — sessionId:", mySessionId);

      const connected = new Promise((res, rej) => {
        setTimeout(rej, 5000);
        const handler = () => {
          if (pc.iceConnectionState === "connected") {
            pc.removeEventListener("iceconnectionstatechange", handler);
            res(undefined);
          }
        };
        pc.addEventListener("iceconnectionstatechange", handler);
      });

      await pc.setRemoteDescription(
        new RTCSessionDescription(pushTracksResponse.data.sessionDescription)
      );
      await connected;
      // User 2 is now sending (local video already shown above)

      // ========== Part 2: Get User 1's tracks from room info and show in remote video ==========
      function buildTracksToPullFromRoomInfo(roomInfo, excludeSessionId) {
        const participants = roomInfo?.data?.participants ?? [];
        const tracksToPull = [];
        for (const p of participants) {
          if (!p.sessionId || !p.isInCall || !p.tracks) continue;
          if (excludeSessionId && p.sessionId === excludeSessionId) continue;
          if (p.tracks.audio)
            tracksToPull.push({ location: "remote", trackName: p.tracks.audio, sessionId: p.sessionId });
          if (p.tracks.video)
            tracksToPull.push({ location: "remote", trackName: p.tracks.video, sessionId: p.sessionId });
        }
        return tracksToPull;
      }

      const roomInfoResponse = await fetch(
        `${API_BASE}/share-nest/api/v1/talk/rooms/${ROOM_TOKEN}`,
        { headers: getHeader(USER_2_TOKEN) }
      ).then((res) => res.json());

      const tracksToPull = buildTracksToPullFromRoomInfo(roomInfoResponse, mySessionId);
      if (tracksToPull.length === 0) {
        statusEl.textContent = "No remote stream yet. Start index3 (User 1) first.";
      } else {
        statusEl.textContent = "Subscribing to " + tracksToPull.length + " track(s)…";

        // const receivePeerConnection = await createPeerConnection();

        const pullResponse = await fetch(
          `${API_BASE}/share-nest/api/v1/talk/sessions/${mySessionId}/tracks/subscribe`,
          {
            method: "POST",
            headers: getHeader(USER_2_TOKEN),
            body: JSON.stringify({ tracks: tracksToPull }),
          }
        ).then((res) => res.json());
        console.log("subscribe track —", pullResponse.data);

        const resolvingTracks = Promise.all(
          pullResponse.data.tracks.map(
            ({ mid }) =>
              new Promise((res, rej) => {
                setTimeout(
                  () => rej(new Error(`Track with mid ${mid} not received in time`)),
                  5000
                );
                const handleTrack = ({ transceiver, track }) => {
                  if (String(transceiver.mid) !== String(mid)) return;
                  pc.removeEventListener("track", handleTrack);
                  res(track);
                };
                pc.addEventListener("track", handleTrack);
              })
          )
        );

        if (pullResponse.data.requiresImmediateRenegotiation) {
          await pc.setRemoteDescription(
            pullResponse.data.sessionDescription
          );
          const remoteAnswer = await pc.createAnswer();
          await pc.setLocalDescription(remoteAnswer);
          const renegotiateResponse = await fetch(
            `${API_BASE}/share-nest/api/v1/talk/sessions/${mySessionId}/renegotiate`,
            {
              method: "PUT",
              headers: getHeader(USER_2_TOKEN),
              body: JSON.stringify({
                sessionDescription: { sdp: remoteAnswer.sdp, type: "answer" },
              }),
            }
          ).then((res) => res.json());
          if (renegotiateResponse.errorCode)
            throw new Error(renegotiateResponse.errorDescription);
        }

        const pulledTracks = await resolvingTracks;
        const remoteVideoStream = new MediaStream();
        remoteVideo.srcObject = remoteVideoStream;
        pulledTracks.forEach((t) => remoteVideoStream.addTrack(t));
        statusEl.textContent = "Connected — showing User 1.";
      }

      async function createCallsSession(TOKEN) {
        const sessionResponse = await fetch(
          `${API_BASE}/share-nest/api/v1/talk/rooms/${ROOM_TOKEN}/join`,
          {
            method: "POST",
            headers: getHeader(TOKEN),
            body: JSON.stringify({ mediaConstraints: { video: true, audio: true } }),
          }
        ).then((res) => res.json());
        console.log("create Session —", sessionResponse.data?.sessionId);
        return sessionResponse.data.sessionId;
      }

      async function signIn(username, password) {
        const authResponse = await fetch(
          `${API_BASE}/share-nest/api/v1/auth/signin`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "USER-DOMAIN": "sharenest.io",
            },
            body: JSON.stringify({ username, password }),
          }
        ).then((res) => res.json());
        console.log("sign In —", authResponse.token ? "ok" : authResponse);
        return authResponse.token;
      }

      async function createPeerConnection() {
        return new RTCPeerConnection({
          iceServers: [{ urls: "stun:stun.cloudflare.com:3478" }],
          bundlePolicy: "max-bundle",
        });
      }
    </script>
    <style>
      html { color-scheme: light dark; font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; }
      body, h1, h2 { margin: 0; }
      h1 { font-size: 1.5rem; grid-column: 1 / -1; }
      h2 { font-size: 1rem; margin-bottom: 0.5rem; }
      .status { font-size: 0.875rem; color: #888; margin-top: 0.5rem; }
      video { width: 100%; }
      .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; padding: 1rem; }
      @media (max-width: 500px) { .grid { grid-template-columns: minmax(0, 1fr); } }
    </style>
  </body>
</html>
